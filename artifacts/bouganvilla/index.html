    <!-- Structured data: LocalBusiness -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",

      "name": "Bougan Villa",
      "description": "Boutique vacation rental agency on the Portuguese coast — Setúbal and Silver Coast.",

      "email": "info@bouganvilla.com",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "PT",
        "addressRegion": "Setúbal"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 38.55,
        "longitude": -9.0
      }
    }
